<h1>Liste des collections</h1>

<form (submit)="ajouterOuModifier()" [formGroup]="formCollectionGroup" class="form-container" >
  <div class="form-field">
    <label for="nom">Nom de la collection</label>
    <input id="nom" type="text" placeholder="Ex: Littérature classique" [formControl]="formCollectionNomCtrl" />

    @if (formCollectionNomCtrl.dirty && formCollectionNomCtrl.hasError('required')) {
      <div class="required-msg">
        Le nom est obligatoire !
      </div>
    }
  </div>



  <div class="form-actions">
    <button [disabled]="formCollectionGroup.invalid" type="submit" [class]="editingCollectionId? 'btn-edit' : 'btn-add'"
    [value]="editingCollectionId? 'Modifier' : 'Ajouter'">{{ editingCollectionId ? 'Modifier' : 'Ajouter' }}</button>
    @if (editingCollectionId) {
      <button type="button" (click)="annulerEdition()" class="btn-cancel">Annuler</button>
    }
  </div>
</form>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nom</th>
      <th></th>
    </tr>
  </thead>

  <tbody>
    @for (collection of (collections$ | async); track collection.id) {
      <tr>
        <td>{{ collection.id }}</td>
        <td>{{ collection.nom }}</td>
        <td>
          <button (click)="editer(collection)" class="btn-edit">Editer</button>
          <button (click)="supprimer(collection)" class="btn-delete">Supprimer</button>
        </td>
      </tr>
    }
  </tbody>
</table>
